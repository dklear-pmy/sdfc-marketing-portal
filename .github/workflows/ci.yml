name: CI

# Build + typecheck on every PR and push to main. No deploys here.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      # Import the app without credentials — catches wiring errors early.
      - run: python -c "from app.main import app; print(app.title)"
      # Canary FAIL paths: the checks that make a quiet PASS trustworthy, so
      # their ability to fail is pinned down rather than assumed. No creds.
      - run: python tests/test_tripwire_checks.py
      # Slug precheck findings incl. the dual-entry (twin on prod event) class.
      - run: python tests/test_slug_registry.py
      # Liquid coverage: static reference gaps + delivered-render verification.
      - run: python tests/test_render_checks.py
