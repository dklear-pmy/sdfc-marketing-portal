name: Deploy

# Deploys on every push to main (single environment: sdfc-udp-dev).
# Same pattern as sdfc-talent-platform: keyless auth via Workload Identity
# Federation — GitHub's OIDC token is exchanged for
# github-actions-deployer@sdfc-udp-dev. Pool/provider bootstrap: see SETUP.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/133738605371/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-actions-deployer@sdfc-udp-dev.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Run
        working-directory: api
        run: ./deploy.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Deploy Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project sdfc-udp-dev --non-interactive
