name: Deploy

# Deploys on every push to main (single environment: sdfc-udp-dev).
# Same pattern as sdfc-talent-platform: keyless auth via Workload Identity
# Federation — GitHub's OIDC token is exchanged for
# github-actions-deployer@sdfc-udp-dev. Pool/provider bootstrap: see SETUP.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/133738605371/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-actions-deployer@sdfc-udp-dev.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # CI builds the image itself and deploys by digest — deliberately NOT
      # `gcloud run deploy --source`, which needs project-level storage
      # permissions the deployer SA doesn't get in this project.
      - name: Build and push API image
        run: |
          gcloud auth configure-docker us-west2-docker.pkg.dev --quiet
          IMAGE="us-west2-docker.pkg.dev/sdfc-udp-dev/cloud-run-source-deploy/marketing-portal-api:${GITHUB_SHA}"
          docker build -t "$IMAGE" api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy marketing-portal-api \
            --project=sdfc-udp-dev \
            --region=us-west2 \
            --image="$IMAGE" \
            --service-account=marketing-portal-sa@sdfc-udp-dev.iam.gserviceaccount.com \
            --set-env-vars="^|^CORS_ORIGINS=https://marketing.sdfc.dev,https://portal.sdfc.dev|TICK_AUDIENCE=sdfc-marketing-portal-tick" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Deploy Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project sdfc-udp-dev --non-interactive
