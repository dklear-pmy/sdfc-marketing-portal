<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Club crest, as served by MLS for sandiegofc.com:
         images.mlssoccer.com/image/upload/assets/logos/SD.svg (copied in, not
         hot-linked). SVG first; the 32px PNG covers anything that won't take
         it. The touch icon is inset on white because iOS renders transparency
         as black and masks the corners, which would clip the shield. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2341" />
    <title>SDFC Marketing Ops</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
